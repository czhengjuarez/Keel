name: Publish @ops-forward/keel

# Publishes with npm trusted publishing (OIDC): no npm token is stored anywhere.
# Trigger by pushing a tag that matches the package version, e.g. `keel-v0.2.0`,
# or run it by hand from the Actions tab.

on:
  push:
    tags:
      - 'keel-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm ci

      - name: Check tag matches package version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./packages/keel/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "keel-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi

      - run: npm run tokens:check
      - run: npm run skill:check
      - run: npm run registry:check

      - name: Skip if this version is already on npm
        id: published
        working-directory: packages/keel
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@ops-forward/keel@${version}" version >/dev/null 2>&1; then
            echo "@ops-forward/keel@${version} is already published"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      # prepack runs typecheck, tests and build before the tarball is made.
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        working-directory: packages/keel
        run: npm publish --no-workspaces --access public
